name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3

  sast:
    name: SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install matrix-pinned Semgrep
        run: |
          version="$(python3 -c 'import json; print(json.load(open(".sylvain/compatibility-matrix.json"))["security"]["semgrep"])')"
          pipx install "semgrep==${version}"
          test "$(semgrep --version | head -n 1)" = "${version}"
      - name: Scan custom security rules
        run: semgrep scan --config .semgrep/security.yml --error --quiet

  dependency-and-build:
    name: Dependency and build gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Java
        if: ${{ hashFiles('**/pom.xml') != '' }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
      - name: Verify Maven modules
        if: ${{ hashFiles('**/pom.xml') != '' }}
        run: find . -name pom.xml -not -path '*/target/*' -execdir mvn -q verify \;
      - name: Set up Node
        if: ${{ hashFiles('**/package.json') != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: pnpm
      - name: Verify pnpm modules
        if: ${{ hashFiles('**/package.json') != '' }}
        run: |
          corepack enable
          version="$(node -p "require('./.sylvain/compatibility-matrix.json').frontend.pnpm")"
          corepack prepare "pnpm@${version}" --activate
          test "$(pnpm --version)" = "${version}"
          find . -name package.json -not -path '*/node_modules/*' -execdir sh -c 'pnpm install --frozen-lockfile && pnpm audit --prod --audit-level high && pnpm run lint && pnpm run test && pnpm run build' \;

  trivy:
    name: Container and IaC scan
    if: ${{ hashFiles('**/Dockerfile', '**/*.tf', '**/docker-compose*.yml', '**/docker-compose*.yaml', '**/Chart.yaml') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: '1'

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@f3c49fd1ef3281abc41069b3dd22807a60c963f6 # v4
